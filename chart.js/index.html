<canvas id="myChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const labels = [];

const data = {
  labels,
  datasets: [
    {
      label: 'Dunkin',
      data: [16, 14, 11, 15, 11, 10],
      borderColor: 'purple',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Panera',
      data: [13, 14, 13, 13, 12, 12, 12],
      borderColor: 'blue',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Starbucks',
      data: [2, 3, 5, 3, 1],
      borderColor: 'green',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    }
  ]
};

const totalDuration = 10000;
const maxPoints = Math.max(...data.datasets.map(ds => ds.data.length));
const delayBetweenPoints = totalDuration / maxPoints;

const previousY = (ctx) => {
  if (ctx.index === 0) {
    return ctx.chart.scales.y.getPixelForValue(0);
  }

  return ctx.chart
    .getDatasetMeta(ctx.datasetIndex)
    .data[ctx.index - 1]
    .getProps(['y'], true).y;
};

const animation = {
  x: {
    type: 'number',
    easing: 'linear',
    duration: delayBetweenPoints,
    from: NaN,
    delay(ctx) {
      if (ctx.type !== 'data' || ctx.xStarted) return 0;
      ctx.xStarted = true;
      return ctx.index * delayBetweenPoints;
    }
  },
  y: {
    type: 'number',
    easing: 'linear',
    duration: delayBetweenPoints,
    from: previousY,
    delay(ctx) {
      if (ctx.type !== 'data' || ctx.yStarted) return 0;
      ctx.yStarted = true;
      return ctx.index * delayBetweenPoints;
    }
  }
};

new Chart(document.getElementById('myChart'), {
  type: 'line',
  data,
  options: {
    animation,
    interaction: {
      intersect: false
    },
    plugins: {
      legend: {
        display: true
      }
    },
    scales: {
      x: {
        type: 'category'
      },
      y: {
        beginAtZero: true
      }
    }
  }
});
</script>
