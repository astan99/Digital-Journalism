<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data_Work 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   
 
</head>
<body>

    

    <div id="container">
        <div id="name">
            <h1>Aiden Stanton</h1>

        </div>
        <div id="picture_one">
            <img src="images/minuteman.jpg" alt="Image of different minuteman missiles">

        </div>
        <div id="graph 1">
            <canvas id="myChart"></canvas>
            <script>
                const labels = ["1945", "1955", "1965", "1975", "1985", "1995", "2005", "2015", "2025"];
                const data = {
  labels,
  datasets: [
    {
      label: 'United States',
      data: [2, 2422, 31139, 27519, 23368, 10904, 8360, 4571, 3700],
      borderColor: 'blue',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Russia',
      data: [0, 200, 6144, 19235, 38582, 18179, 7000, 4500, 4309],
      borderColor: 'red',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    
    ]
};
 new Chart(document.getElementById('myChart'), {
  type: 'line',
  data,
  options: {
    interaction: {
      intersect: false
    },
    plugins: {
      legend: {
        display: true
      }
    },
    scales: {
      x: {
        type: 'category'
      },
      y: {
        beginAtZero: true
      }
    }
  }
 });
                
            </script>

        </div>
        <div id="picture 2">
            <img src="images/launch.jpg" alt="Image showing the launch of a missile">

        </div>
        <div id="graph 2">
            <canvas id="myChart2"></canvas>
            <script>
                const countries = ["China", "France", "United Kingdom", "India", "Pakistan", "Israel", "North Korea"];

    const warheads = [600, 290, 225, 180, 170, 90, 50];

    new Chart(document.getElementById('myChart2'), {
        type: 'bar',
        data: {
            labels: countries,
            datasets: [
                {
                    label: 'Nuclear Warheads (2025)',
                    data: warheads,
                    backgroundColor: 'blue',
                    borderWidth: 1
                }
            ]
        },
        options: {
            indexAxis: 'y',
            scales: {
                x: {
                    beginAtZero: true
                }
            }
        }
    });
        
    
            </script>

        </div>
        <div id="choices">
            <p></p>

        </div>

    </div>
    
</body>

</html>
